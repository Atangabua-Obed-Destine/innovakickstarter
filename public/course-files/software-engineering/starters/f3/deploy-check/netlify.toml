# Netlify reads this file from the root of your repository.
[build]
  command = "npm run build"
  publish = "dist"

# A single-page app: every address that is not a real file gets index.html,
# so /products/6 still opens after a refresh. React Router then shows the right page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
