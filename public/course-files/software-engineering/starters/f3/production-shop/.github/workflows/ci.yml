# Runs on GitHub's computers every time you push or open a pull request.
# Free for public repositories. A red cross on a commit means: look at this before you deploy.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/check-budget.mjs
