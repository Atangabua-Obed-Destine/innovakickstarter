<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mile 4 branch | Nkwen Traders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="branch-name">Mile 4 branch</h1>
    <p class="manager">Manager: Mr. Tanyi Godlove</p>
    <img src="logo.svg" alt="Nkwen Traders Ltd." width="240" height="64">

    <h2>On the shelf today</h2>
    <ul id="shelf">
      <li class="product" data-price="305">Salt 1kg</li>
      <li class="product low" data-price="36005">Rice 50kg</li>
      <li class="product" data-price="6600">Palm Oil 5L</li>
      <li class="product low" data-price="410">Soap (bar)</li>
      <li class="product" data-price="705">Onions 1kg</li>
    </ul>
    <p>Products marked <strong>low</strong> have 5 units or fewer.</p>

    <p><a id="directions" href="#map">How to find us</a></p>

    <p id="status">Waiting for JavaScript...</p>

    <section aria-labelledby="check-title">
      <h2 id="check-title">Self-check</h2>
      <ul id="self-check"></ul>
    </section>
  </main>

  <script src="dom.js"></script>
  <script src="self-check.js"></script>
</body>
</html>
