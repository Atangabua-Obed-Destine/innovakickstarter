<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remember my basket | Nkwen Traders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Remember my basket</h1>
    <p>Choose a branch, add a few things, then refresh the page (F5). Does the page remember?</p>

    <label for="branch">My branch</label>
    <select id="branch">
      <option value="NKW">Nkwen, Bamenda</option>
      <option value="ML4">Mile 4, Bamenda</option>
      <option value="CAV">Commercial Avenue, Bamenda</option>
      <option value="BAF">Bafoussam Centre, Bafoussam</option>
    </select>

    <div class="buttons">
      <button type="button" data-id="9">Add Sugar 1kg</button>
      <button type="button" data-id="6">Add Rice 50kg</button>
      <button type="button" data-id="13">Add Soap (bar)</button>
    </div>

    <h2>Basket (<span id="count">0</span> items)</h2>
    <ul id="basket"></ul>
    <button type="button" id="clear" class="secondary">Empty the basket</button>
  </main>

  <script src="products.js"></script>
  <script src="storage.js"></script>
  <script src="demo.js"></script>
</body>
</html>
